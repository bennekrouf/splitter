[workspace]
resolver = "2"
members = ["crates/core", "crates/audio", "crates/app"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.6"
edition = "2021"

[workspace.dependencies]
splitter-core = { path = "crates/core" }
splitter-audio = { path = "crates/audio" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
crossbeam-channel = "0.5"
dirs = "6"
symphonia = { version = "0.5.5", features = ["mp3", "isomp4", "aac"] }
cpal = "0.15"
dioxus = { version = "0.7", features = ["desktop"] }
tokio = { version = "1", features = ["time"] }
rfd = "0.15"
flacenc = "0.5"
ebur128 = "0.1"
mp3lame-encoder = "0.2"

# Decoding and peak building are far too slow unoptimised; keep debug builds usable.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.splitter-audio]
opt-level = 3

# block 0.1.6 (via dioxus-desktop -> cocoa) is unmaintained and trips a future-incompat lint;
# vendor/block is the same release with that one type fixed.
[patch.crates-io]
block = { path = "vendor/block" }
