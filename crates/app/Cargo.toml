[package]
name = "splitter"
version.workspace = true
edition.workspace = true
description = "Split long MP3/WAV recordings into tracks"

[dependencies]
splitter-core.workspace = true
splitter-audio.workspace = true
dioxus.workspace = true
tokio.workspace = true
rfd.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
# Decodes assets/icon.png into the runtime window icon; png is the only format needed.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
symphonia.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
